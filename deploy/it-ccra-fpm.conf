; it.ccra.tw 獨立的 PHP-FPM 程序池（2026-10-17）
; 原因：同主機 mon.ccra.tw（Zabbix）用 fastcgi_param PHP_VALUE 改 post_max_size、max_execution_time、date.timezone，
;       共用 www 池時這些值會殘留到 it.ccra.tw 的請求，部分頁面（如 /survey/）的台北時間其實是靠殘留值才對。
;       獨立程序池後互不影響；時區在這裡明訂，不再依賴別站。各目錄的 .user.ini（如 /repair/ 上傳上限）照常生效。
; 由 deploy.sh 安裝到 /etc/php/8.5/fpm/pool.d/it-ccra.conf；nginx 改連 /run/php/it-ccra.sock
[it-ccra]
user = www-data
group = www-data
listen = /run/php/it-ccra.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[date.timezone] = Asia/Taipei
