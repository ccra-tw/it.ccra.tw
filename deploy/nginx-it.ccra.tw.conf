# it.ccra.tw  資訊服務入口（內部主機 ITSrv01，經 Cloudflare Tunnel 對外）
# 只聽 127.0.0.1：外界唯一的進入路徑是 cloudflared → localhost。
# 登入由 Cloudflare Access 把關，PHP 端另驗 JWT（/var/www/it-lib/access.php）。
server {
    listen 127.0.0.1:80;
    server_name it.ccra.tw;
    root /var/www/it.ccra.tw;
    index index.php index.html;
    access_log /var/log/nginx/it.ccra.tw.access.log;
    error_log  /var/log/nginx/it.ccra.tw.error.log;
    location / { }
    # 系統 mime.types 沒有 .webmanifest，預設會回 octet-stream，部分瀏覽器因此不採用 manifest（桌面捷徑沒有圖示）
    location = /manifest.webmanifest { default_type application/manifest+json; }
    # 資訊報修可附 3 張截圖（每張 5MB），其餘頁面維持預設 1MB
    location ^~ /repair/ {
        client_max_body_size 20m;
        location ~ /\. { deny all; return 404; }   # ^~ 會略過外層規則，.user.ini 要在這裡另外擋
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/it-ccra.sock;
        }
    }
    # 捐款名單地址整理：一次最多 10 個 Excel（單檔 20MB），處理最長 5 分鐘。
    # 名單含個資：上傳本文暫存放 addr-tmp/.nginx-body、走專用 PHP 池（上傳暫存在 addr-tmp/.upload）、
    # 下載不經 FastCGI 暫存檔（fastcgi_buffering off），三處都只在 addr-tmp 底下，補清只清這裡。
    location ^~ /addr/ {
        client_max_body_size 60m;
        client_body_temp_path /var/lib/it-ccra/addr-tmp/.nginx-body;
        location ~ /\. { deny all; return 404; }
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/it-ccra-addr.sock;
            fastcgi_read_timeout 360s;
            fastcgi_buffering off;
        }
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/it-ccra.sock;
    }
    location ~ /\. { deny all; return 404; }
}
