; /addr/（捐款名單地址整理）專用 PHP 程序池：上傳暫存放在 addr-tmp/.upload，
; 不和其他頁面共用 /tmp，補清程序才能只清這裡、不碰別的功能的暫存（小鹿 10/21 第三次互審）。
[it-ccra-addr]
user = www-data
group = www-data
listen = /run/php/it-ccra-addr.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 60s
php_admin_value[date.timezone] = Asia/Taipei
; 讓同為 www-data 的補清程序讀得到本池 worker 的 /proc/<pid>/fd，才能判斷上傳暫存是否仍在使用（小鹿第四次互審）
process.dumpable = yes
php_admin_value[upload_tmp_dir] = /var/lib/it-ccra/addr-tmp/.upload
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 60M
php_admin_value[max_file_uploads] = 10
php_admin_value[max_execution_time] = 330
