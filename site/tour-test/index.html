<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>環台前導路線（試用版）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html,body{margin:0;height:100%;font-family:system-ui,"Microsoft JhengHei",sans-serif}
  #map{position:absolute;inset:0}
  #bar{position:absolute;z-index:1000;left:8px;right:8px;top:8px;background:#fff;border-radius:10px;
       box-shadow:0 2px 8px rgba(0,0,0,.25);padding:8px 10px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #bar b{font-size:16px}
  button,label.btn{border:0;border-radius:8px;padding:8px 12px;font-size:15px;background:#1f6feb;color:#fff}
  #info{flex:1 1 100%;color:#333}
  input[type=file]{display:none}
  #modes{display:flex;gap:0;flex:1 1 100%}
  #modes button{flex:1;border-radius:0;background:#e9eef5;color:#333}
  #modes button:first-child{border-radius:8px 0 0 8px}
  #modes button:last-child{border-radius:0 8px 8px 0}
  #modes button.on{background:#1f6feb;color:#fff;font-weight:700}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <div id="modes"><button id="mRide">騎乘模式（活動當天）</button><button id="mScout">探路模式</button></div>
  <b id="title">環台前導路線</b>
  <label class="btn">開啟路線檔（GPX）<input id="file" type="file" accept=".gpx,application/gpx+xml"></label>
  <button id="follow">跟隨我的位置</button>
  <button id="rec">開始記錄</button>
  <button id="mark" style="display:none;background:#e07a00">記錄目前位置</button>
  <button id="end" style="display:none;background:#8e44ad">結束這段並下載</button>
  <button id="dl" style="display:none">下載記錄（GPX）</button>
  <button id="clr" style="display:none;background:#6c757d">清除記錄</button>
  <div id="warn" style="display:none;flex:1 1 100%;background:#fdecea;color:#b3261e;border-radius:6px;padding:6px 8px;font-weight:600"></div>
  <div id="info">紅線＝要走的路線；藍線＝已經走過的部分；綠線＝探路記錄；橘點＝探路時記下的地點。</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', {zoomControl:false}).setView([25.05,121.52], 12);
L.control.zoom({position:'bottomright'}).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
// 底圖（熊哥 11/11：改 Google 地圖）：有網路就換成 Google 地圖；沒訊號或載不到時留在 OpenStreetMap（看過的區塊有離線快取）。
// Google 地圖不能離線，所以 OSM 是退路，路線、定位、記錄都畫在同一個 Leaflet 地圖上，不受底圖影響。
// 狀態：gState = 'osm'（底圖是 OSM）／'loading'／'google'；gAuthBad＝金鑰被 Google 拒絕（之後不再試）
let gState = 'osm', gLayer = null, gAuthBad = false;
function toOsm(){ if (gLayer && map.hasLayer(gLayer)) map.removeLayer(gLayer); if (!map.hasLayer(osm)) osm.addTo(map); gState = 'osm'; }
// 捷運、鐵路線關掉：Google 地圖的捷運線是紅、藍色，會和「紅線＝要走、藍線＝已走」混淆
function addGoogleLayer(){
  try { gLayer = gLayer || L.gridLayer.googleMutant({type:'roadmap', maxZoom:20, styles:[{featureType:'transit', elementType:'geometry', stylers:[{visibility:'off'}]}, {featureType:'transit.station.rail', stylers:[{visibility:'off'}]}]}); gLayer.addTo(map); map.removeLayer(osm); gState = 'google'; }
  catch(e) { toOsm(); }
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function useGoogle(){
  if (!navigator.onLine || gAuthBad || gState !== 'osm') return;
  gState = 'loading';
  try {
    if (!(window.google && google.maps && google.maps.Map)) {
      // 金鑰不寫在網頁原始碼（程式庫公開），由主機上的 key.php 讀設定檔給出；拿不到就留在 OSM
      const r = await fetch('key.php', {cache:'no-store'});
      const k = r.ok ? (await r.text()).trim() : '';
      if (!/^[A-Za-z0-9_-]{30,60}$/.test(k)) throw new Error('no key');
      await new Promise((ok, bad) => { window._gmReady = ok; loadScript('https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(k) + '&loading=async&callback=_gmReady&language=zh-TW&region=TW').catch(bad); });
    }
    if (!(L.gridLayer && L.gridLayer.googleMutant)) await loadScript('https://cdn.jsdelivr.net/npm/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js');
    if (gAuthBad || !navigator.onLine) { toOsm(); return; }
    addGoogleLayer();
  } catch(e) { toOsm(); }                                    // 任何一步失敗都留在 OSM，恢復網路時再試
}
window.gm_authFailure = function(){ gAuthBad = true; toOsm(); };   // 金鑰不認這個網址：退回 OSM，不再重試
window.addEventListener('online', () => useGoogle());
window.addEventListener('offline', () => toOsm());            // 斷線時 Google 底圖會變空白，立刻換回有離線快取的 OSM
useGoogle();

let pts = [], red = null, blue = null, me = null, follow = true, doneIdx = 0;
const info = document.getElementById('info');

// 持續顯示的警告：不會被下一次定位訊息蓋掉，直到問題排除才清掉
const warnBox = document.getElementById('warn'), warns = {};
function setWarn(key, msg){
  if (msg) warns[key] = msg; else delete warns[key];
  const all = Object.values(warns);
  warnBox.textContent = all.join(' ');
  warnBox.style.display = all.length ? '' : 'none';
}
// 先完整驗證，任何一點不合格就整份不收（回傳 {error}），不動到現有路線
function parseGpx(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) return {error:'這不是有效的 GPX 檔（格式錯誤），請換一個 GPX 檔。'};
  const nodes = [...xml.querySelectorAll('trkpt, rtept')];
  if (!nodes.length) return {error:'這個檔案裡沒有路線點，請換一個 GPX 檔。'};
  const out = [];
  for (const n of nodes){
    const sLa = (n.getAttribute('lat') || '').trim(), sLo = (n.getAttribute('lon') || '').trim();
    const la = sLa === '' ? NaN : Number(sLa), lo = sLo === '' ? NaN : Number(sLo);   // 缺屬性／空白不可變成 0
    if (!Number.isFinite(la) || !Number.isFinite(lo) || la < -90 || la > 90 || lo < -180 || lo > 180)
      return {error:`檔案裡有無效座標（第 ${out.length + 1} 個點），請換一個 GPX 檔。原本的路線沒有變動。`};
    out.push([la, lo]);
  }
  const name = (xml.querySelector('trk > name, rte > name, metadata > name') || {}).textContent;
  return {name, pts: out};
}
function dist(a,b){ // meters
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLa=toR(b[0]-a[0]), dLo=toR(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function totalKm(p, upto){ let s=0; for(let i=1;i<=upto && i<p.length;i++) s+=dist(p[i-1],p[i]); return s/1000; }
// save=false：從手機裡讀回已存的路線時用，不再寫一次
function loadRoute(text, save = true){
  const r = parseGpx(text);
  if (r.error){ setWarn('gpx', r.error); return false; }
  // 新圖層先畫好，成功了才換掉舊的；中途出錯就保留原本路線
  let newRed, newBlue;
  try {
    newRed = L.polyline(r.pts, {color:'#e5383b', weight:6, opacity:.85});
    newBlue = L.polyline([], {color:'#1f6feb', weight:7});
    newRed.addTo(map); newBlue.addTo(map);
  } catch(e) {
    if (newRed) map.removeLayer(newRed); if (newBlue) map.removeLayer(newBlue);
    setWarn('gpx', '這個 GPX 檔畫不出來，請換一個 GPX 檔。原本的路線沒有變動。');
    return false;
  }
  if (red) map.removeLayer(red); if (blue) map.removeLayer(blue);
  red = newRed; blue = newBlue; pts = r.pts; doneIdx = 0;
  setWarn('gpx', null);
  map.fitBounds(red.getBounds(), {padding:[30,30]});
  document.getElementById('title').textContent = r.name || '環台前導路線';
  info.textContent = `全程 ${totalKm(pts, pts.length).toFixed(1)} 公里，${pts.length} 個點。`;
  if (save){
    try { localStorage.setItem('route', text); setWarn('route', null); }
    catch(e) { setWarn('route', '路線沒能存進手機：這次可以看，但重新整理或沒網路重開時要再開一次 GPX 檔。'); }
  }
  return true;
}
document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  f.text().then(t => loadRoute(t)).catch(() => setWarn('gpx', '檔案讀不出來，請換一個 GPX 檔。原本的路線沒有變動。'));
});
document.getElementById('follow').addEventListener('click', () => { follow = true; if (me) map.setView(me.getLatLng(), 16); });
map.on('dragstart', () => follow = false);

// 點到線段的距離（公尺）與投影比例：GPX 點常相隔幾十公尺，只量到「最近的點」會把走在路線上誤判成偏離
function segDist(p, a, b){
  const k = Math.cos(p[0] * Math.PI / 180), R = 6371000 * Math.PI / 180;
  const ax = (a[1] - p[1]) * k * R, ay = (a[0] - p[0]) * R, bx = (b[1] - p[1]) * k * R, by = (b[0] - p[0]) * R;
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  const t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
  return Math.hypot(ax + t * dx, ay + t * dy);
}
const ON_ROUTE = 25, MAX_ACC = 30;     // 25 公尺內才算在路線上；定位誤差大於 30 公尺的那一刻不推進（沐恩 11/10：走旁邊的路卻畫成藍色）
// 只往前推進：在目前已走位置之後的一段範圍內找最近線段，避免折返路段跳號
function advance(pos, acc){
  if (!pts.length) return null;
  let best = -1, bestD = Infinity;
  const near = (from, to) => { for (let i = from; i < to; i++){ const d = i + 1 < pts.length ? segDist(pos, pts[i], pts[i + 1]) : dist(pos, pts[i]); if (d < bestD + 0.01){ bestD = Math.min(bestD, d); best = i; } } };   // 剛好在點上時兩段都是 0：取後一段，進度才會推到這個點
  const end = Math.min(pts.length, doneIdx + 400);
  near(doneIdx, end);
  if (bestD > 200) near(end, pts.length);              // 附近找不到（中途才打開、重新整理）→ 往後整段找一次
  if (best >= 0 && bestD <= ON_ROUTE && !(acc > MAX_ACC)) doneIdx = Math.max(doneIdx, best);
  blue.setLatLngs(pts.slice(0, doneIdx + 1));
  return bestD;
}
// 偏離警告看「整條路線」最近的線段（含已走過的部分）：回到走過的紅線上不可誤報偏離（大沈第九輪）
function routeDist(pos){
  let d = Infinity;
  for (let i = 0; i < pts.length; i++){ const x = i + 1 < pts.length ? segDist(pos, pts[i], pts[i + 1]) : dist(pos, pts[i]); if (x < d) d = x; }
  return d;
}
// 遲滯：連續 2 次超過 30 公尺才亮偏離警告，回到 20 公尺內才熄，避免在門檻邊緣反覆跳動
const OFF_ON = ON_ROUTE + 5, OFF_CLEAR = ON_ROUTE - 5;
let offHits = 0, offShown = false;
function updateOff(d){
  if (d > OFF_ON) { offHits++; if (offHits >= 2) offShown = true; }
  else { offHits = 0; if (d <= OFF_CLEAR) offShown = false; }   // 中間沒超標就不算「連續」；已亮的警告要回到 20 公尺內才熄（大沈第十輪）
  setWarn('off', offShown ? `⚠ 偏離路線約 ${Math.round(d)} 公尺，請回到紅線` : null);
}
// 實際走過的軌跡（細虛線，只存在這次開啟的記憶體裡）：偏離路線時一眼看得出自己走在哪
let lastFix = null;
let track = [], trackLine = L.polyline([], {color:'#1f6feb', weight:3, opacity:.7, dashArray:'4 6'}).addTo(map), accCircle = null, firstFix = true;
if ('geolocation' in navigator){
  navigator.geolocation.watchPosition(p => {
    const pos = [p.coords.latitude, p.coords.longitude], acc = p.coords.accuracy;
    lastFix = {pos, acc, t: Date.now()}; setWarn('geo', null);
    if (!me) me = L.circleMarker(pos, {radius:9, color:'#fff', weight:3, fillColor:'#1f6feb', fillOpacity:1}).addTo(map);
    me.setLatLng(pos);
    if (!accCircle) accCircle = L.circle(pos, {radius: acc || 0, color:'#1f6feb', weight:1, fillOpacity:.08, interactive:false}).addTo(map);
    accCircle.setLatLng(pos); accCircle.setRadius(acc || 0);
    if (follow) map.setView(pos, firstFix ? 17 : Math.max(map.getZoom(), 16));   // 騎乘時看得到路口：預設放大到街道等級
    firstFix = false;
    if (!(acc > MAX_ACC)) { const last = track[track.length - 1]; if (!last || dist(last, pos) >= 5) { track.push(pos); if (track.length > 5000) track.shift(); trackLine.setLatLngs(track); } }
    recordPoint(p);
    const off = advance(pos, acc);
    if (pts.length){
      const doneKm = totalKm(pts, doneIdx), all = totalKm(pts, pts.length);
      info.textContent = `已走 ${doneKm.toFixed(1)}／${all.toFixed(1)} 公里` + (acc > MAX_ACC ? `（定位誤差約 ${Math.round(acc)} 公尺，等待更準的位置）` : '');
      if (!(acc > MAX_ACC)) updateOff(routeDist(pos));
    }
  }, err => {
    // 逾時（code 3）在訊號弱時常發生、下一次就會回來：已經有過位置就不喊；權限被拒或完全拿不到才持續顯示
    if (err.code === 3 && lastFix) return;
    setWarn('geo', err.code === 1 ? '沒有定位權限：請到手機設定允許這個網頁使用位置，再重新整理。' : '暫時拿不到定位，請移到看得到天空的地方，或確認手機的定位已開啟。');
  }, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
}
try { const saved = localStorage.getItem('route'); if (saved && !loadRoute(saved, false)) setWarn('gpx', '手機裡存的路線讀不出來，請重新開啟 GPX 檔。'); } catch(e) {}

// 探路記錄：按「開始記錄」後，把走過的點存起來（存在手機裡，沒訊號也照記），可下載成 GPX 傳給資訊部
let recOn = false, rec = [], recLine = L.polyline([], {color:'#2a9d3c', weight:5}).addTo(map), wake = null;
const recBtn = document.getElementById('rec'), dlBtn = document.getElementById('dl'), clrBtn = document.getElementById('clr'), endBtn = document.getElementById('end');
let downloaded = false, exportedLen = 0;   // exportedLen：上次下載時已匯出的點數（存不進手機時，用來判斷這份記錄是否已備份）
// 讀回手機裡的舊記錄：先驗結構再用；壞掉的原始內容另存 rec_backup，不靜默覆寫，也不讓初始化中斷
(function restoreRec(){
  let raw = null;
  try { raw = localStorage.getItem('rec'); } catch(e) { raw = null; }
  if (raw === null || raw === '') { rec = []; return; }
  const okPt = p => Array.isArray(p) && p.length >= 2 &&
    Number.isFinite(p[0]) && Number.isFinite(p[1]) && p[0] >= -90 && p[0] <= 90 && p[1] >= -180 && p[1] <= 180 &&
    (p[2] === undefined || p[2] === null || Number.isFinite(p[2]));  // 時間壞掉不丟點，下面改成「無時間」
  let data = null;
  try { data = JSON.parse(raw); } catch(e) { data = null; }
  const backup = () => { try { localStorage.setItem('rec_backup', raw); return true; } catch(e) { return false; } };
  if (!Array.isArray(data)) {
    rec = [];
    const saved = backup();
    setWarn('restore', saved ? '手機裡的舊探路記錄格式損毀，讀不出來；原始內容已另存備份（按「下載損毀備份」可取回），可以照常開始新的記錄。'
                             : '手機裡的舊探路記錄格式損毀，讀不出來，也無法另存備份；請先按「下載損毀備份」取回原始內容，再開始新的記錄。');
    window._recRaw = raw;
    return;
  }
  const good = data.filter(okPt);
  const okTime = t => Number.isFinite(t) && Number.isFinite(new Date(t).getTime());
  let badTime = 0;
  rec = good.map(p => { if (p[2] !== undefined && p[2] !== null && !okTime(p[2])) badTime++; return [p[0], p[1], okTime(p[2]) ? p[2] : null]; });
  if (good.length !== data.length) {
    const saved = backup(); window._recRaw = raw;
    setWarn('restore', `手機裡的舊探路記錄有 ${data.length - good.length} 個點損毀，已略過；保留可用的 ${good.length} 個點。` +
      (saved ? '原始內容已另存備份。' : '原始內容無法另存備份，請先按「下載損毀備份」取回。'));
  }
  if (badTime) {
    if (!window._recRaw) { backup(); window._recRaw = raw; }
    setWarn('restoreTime', `有 ${badTime} 個點的時間損毀，已保留位置、下載時不帶時間。`);
  }
})();
recLine.setLatLngs(rec.map(r => [r[0], r[1]]));
if (window._recRaw) {
  const bk = document.createElement('button');
  bk.textContent = '下載損毀備份'; bk.style.background = '#6c757d';
  bk.addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([window._recRaw], {type:'text/plain'}));
    a.download = `探路記錄_損毀備份_${new Date().toISOString().slice(0,10)}.txt`; a.click();
  });
  document.getElementById('bar').insertBefore(bk, warnBox);
}
dlBtn.style.display = rec.length ? '' : 'none';
// 回傳是否真的存進手機；失敗時記憶體裡的點照留（可下載），並持續警告
function saveRec(){
  try { localStorage.setItem('rec', JSON.stringify(rec)); setWarn('rec', null); return true; }
  catch(e) { setWarn('rec', `⚠ 有 ${rec.length} 個點尚未存入手機，請立即按「下載記錄」備份，不要關閉或重新整理這個頁面。`); return false; }
}
function recordPoint(p){
  if (!recOn) return;
  if (p.coords.accuracy > MAX_ACC) return;                  // 定位誤差大於 30 公尺的點不記（與藍線、虛線同一門檻）
  const pt = [p.coords.latitude, p.coords.longitude, Date.now()];
  const last = rec[rec.length - 1];
  if (last && dist(last, pt) < 8) return;                   // 原地不動不重複記
  rec.push(pt); recLine.addLatLng([pt[0], pt[1]]); saveRec();
  dlBtn.style.display = ''; endBtn.style.display = '';
  downloaded = false; clrBtn.style.display = 'none';        // 下載之後又記了新點：要重新下載才能清
}
recBtn.addEventListener('click', async () => {
  recOn = !recOn;
  recBtn.textContent = recOn ? '暫停記錄' : '繼續記錄';
  recBtn.style.background = recOn ? '#c0392b' : '#1f6feb';
  try { if (recOn && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (wake) { wake.release(); wake = null; } } catch(e) {}
  info.textContent = recOn ? '記錄中：請保持這個畫面開著（螢幕不要關）。' : `已記錄 ${rec.length} 個點，${(rec.reduce((s,r,i)=> i? s+dist(rec[i-1],r):0,0)/1000).toFixed(1)} 公里。`;
});
dlBtn.addEventListener('click', () => {
  const iso = t => { const d = new Date(t); return Number.isFinite(d.getTime()) ? d.toISOString() : null; };
  const pts = rec.map(r => { const t = r[2] == null ? null : iso(r[2]); return `<trkpt lat="${r[0].toFixed(6)}" lon="${r[1].toFixed(6)}">${t ? `<time>${t}</time>` : ''}</trkpt>`; }).join('\n');
  const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const wx = wpts.map(w => { const t = w[2] == null ? null : iso(w[2]); return `<wpt lat="${w[0].toFixed(6)}" lon="${w[1].toFixed(6)}">${t ? `<time>${t}</time>` : ''}<name>${esc(w[3])}</name></wpt>`; }).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="CCRA 環台前導路線" xmlns="http://www.topografix.com/GPX/1/1">${wx ? '\n' + wx + '\n' : ''}<trk><name>探路記錄 ${new Date().toLocaleDateString('zh-TW')}</name><trkseg>\n${pts}\n</trkseg></trk></gpx>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'}));
  const nw = new Date(), pad = n => String(n).padStart(2, '0');   // 一天可能分好幾段：檔名帶到分鐘，不會互相蓋掉
  a.download = `探路記錄_${nw.getFullYear()}-${pad(nw.getMonth() + 1)}-${pad(nw.getDate())}_${pad(nw.getHours())}${pad(nw.getMinutes())}.gpx`; a.click();
  downloaded = true; exportedLen = rec.length; clrBtn.style.display = ''; setWarn('mode', null);
  info.textContent = '已送出下載。請先到手機的「下載」或「檔案」確認那個 GPX 檔打得開，再決定要不要按「清除記錄」。';
});
// 結束這段（沐恩 11/10：探路一天可能看超過一天的路，要能結束一段再下載）：停止記錄＋下載，確認檔案後再清除開始新的一段
endBtn.addEventListener('click', () => {
  if (recOn) { recOn = false; try { if (wake) { wake.release(); wake = null; } } catch(e) {} }
  recBtn.textContent = '開始記錄'; recBtn.style.background = '#1f6feb';
  dlBtn.click();
  info.textContent = `這段已結束並下載（${rec.length} 個軌跡點、${wpts.length} 個記錄點）。請先到手機「下載」或「檔案」確認 GPX 打得開，再按「清除記錄」開始新的一段。`;
});
clrBtn.addEventListener('click', () => {
  if (!downloaded) return;
  if (!confirm(`要清掉手機裡這 ${rec.length} 個軌跡點、${wpts.length} 個記錄點嗎？\n請先確認下載的 GPX 檔已經打得開，清掉就找不回來。`)) return;
  // 先清手機裡存的，成功了才清畫面與記憶體；失敗就整份保留、照樣可下載
  try { localStorage.removeItem('rec'); localStorage.removeItem('wpts'); if (localStorage.getItem('rec') !== null || localStorage.getItem('wpts') !== null) throw new Error('still there'); }
  catch(e) { setWarn('clr', '清除失敗，記錄仍保留在手機裡（可再下載）。請稍後再試一次。'); return; }
  setWarn('clr', null); setWarn('rec', null); setWarn('restore', null); setWarn('restoreTime', null);
  rec = []; recLine.setLatLngs([]); exportedLen = 0; wpts = []; drawWpts(); setWarn('wpt', null); setWarn('mark', null);      // 新一段記錄從 0 算起，沒下載前不算已備份
  dlBtn.style.display = 'none'; clrBtn.style.display = 'none'; endBtn.style.display = 'none'; downloaded = false;
  info.textContent = '記錄已清除。';
});
// 記錄目前位置（沐恩 11/11）：探路時按一下，輸入這裡是什麼（休息點、補給點、廁所…），地圖上標橘點，下載 GPX 時一起帶出（<wpt>）。
// 不需要先開路線檔，也不需要先按「開始記錄」。存在手機裡，與探路記錄一起清除。
const markBtn = document.getElementById('mark'), wptLayer = L.layerGroup().addTo(map);
let wpts = [];
function drawWpts(){ wptLayer.clearLayers(); wpts.forEach(w => L.circleMarker([w[0], w[1]], {radius:8, color:'#fff', weight:2, fillColor:'#e07a00', fillOpacity:1}).bindTooltip(w[3], {permanent:true, direction:'top', offset:[0,-8]}).addTo(wptLayer)); }
function saveWpts(){ try { localStorage.setItem('wpts', JSON.stringify(wpts)); setWarn('wpt', null); return true; } catch(e) { setWarn('wpt', `⚠ 有 ${wpts.length} 個記錄點尚未存入手機，請先按「下載記錄」備份。`); return false; } }
(function(){ let d = null; try { d = JSON.parse(localStorage.getItem('wpts') || '[]'); } catch(e) { d = null; }
  if (!Array.isArray(d)) { setWarn('wpt', '手機裡的記錄點讀不出來，已略過。'); d = []; }
  wpts = d.filter(w => Array.isArray(w) && Number.isFinite(w[0]) && Number.isFinite(w[1]) && Math.abs(w[0]) <= 90 && Math.abs(w[1]) <= 180 && typeof w[3] === 'string')
          .map(w => [w[0], w[1], Number.isFinite(w[2]) ? w[2] : null, w[3].slice(0, 100)]);
  drawWpts(); })();
markBtn.addEventListener('click', () => {
  if (!lastFix || Date.now() - lastFix.t > 60000) { setWarn('mark', '還沒拿到目前位置，請等藍點出現再按。'); return; }
  if (lastFix.acc > MAX_ACC) { setWarn('mark', `目前定位誤差約 ${Math.round(lastFix.acc)} 公尺，等更準一點再按（30 公尺內）。`); return; }
  setWarn('mark', null);
  const at = lastFix.pos;                                      // 先記下按的那一刻的位置，輸入文字時人在移動也不影響
  const txt = prompt('這裡是什麼地方？（例如：休息點－7-11 ○○店、補給點、廁所）', '休息點');
  if (txt === null) return;
  const name = txt.trim().slice(0, 100) || '記錄點';
  wpts.push([at[0], at[1], Date.now(), name]); saveWpts(); drawWpts();
  dlBtn.style.display = ''; endBtn.style.display = ''; downloaded = false; clrBtn.style.display = 'none';
  info.textContent = `已記下「${name}」（共 ${wpts.length} 個記錄點）。`;
});
// 兩種模式（沐恩 11/10）：騎乘＝活動當天只看路線、位置、已走公里數；探路＝才有開始記錄、下載、清除。
// 預設騎乘（避免當天誤按記錄）；手機裡已有探路記錄時預設探路。選擇記在手機裡。
const mRide = document.getElementById('mRide'), mScout = document.getElementById('mScout');
function applyMode(m){
  const scout = m === 'scout';
  mRide.classList.toggle('on', !scout); mScout.classList.toggle('on', scout);
  recBtn.style.display = scout ? '' : 'none'; markBtn.style.display = scout ? '' : 'none';
  dlBtn.style.display = scout && (rec.length || wpts.length) ? '' : 'none';
  endBtn.style.display = scout && (rec.length || wpts.length) ? '' : 'none';
  clrBtn.style.display = scout && downloaded ? '' : 'none';
  if (scout) { if (!map.hasLayer(recLine)) recLine.addTo(map); if (!map.hasLayer(wptLayer)) wptLayer.addTo(map); }
  else { if (map.hasLayer(recLine)) map.removeLayer(recLine); if (map.hasLayer(wptLayer)) map.removeLayer(wptLayer); }
  try { localStorage.setItem('mode', m); } catch(e) {}
}
mRide.addEventListener('click', () => {
  // 存不進手機的點：下載備份過（且之後沒有新點）就可以切換；警告照留，因為手機裡確實還沒存到
  if ((warns.rec && rec.length > exportedLen) || (warns.wpt && wpts.length && !downloaded)) { setWarn('mode', '有探路記錄還沒存進手機，請先在探路模式按「下載記錄」備份，再切換到騎乘模式。'); return; }
  if (recOn) {                                              // 記錄中切換：先暫停，記錄照留在手機裡
    recOn = false; recBtn.textContent = '繼續記錄'; recBtn.style.background = '#1f6feb';
    try { if (wake) { wake.release(); wake = null; } } catch(e) {}
  }
  setWarn('mode', null); applyMode('ride');
  info.textContent = '騎乘模式：照紅線走，走過的路段會自動變藍，不需要按開始。';
});
mScout.addEventListener('click', () => {
  setWarn('mode', null); applyMode('scout');
  info.textContent = (rec.length || wpts.length) ? `探路模式：手機裡有 ${rec.length} 個軌跡點、${wpts.length} 個記錄點，可繼續記錄或下載。` : '探路模式：不用先開路線檔，按「開始記錄」就會把騎過的路存下來；到休息點、補給點按「記錄目前位置」寫下是什麼。回來後按「下載記錄」。';
});
(function(){ let m = null; try { m = localStorage.getItem('mode'); } catch(e) {}
  applyMode(m === 'scout' || m === 'ride' ? m : (rec.length || wpts.length ? 'scout' : 'ride')); })();
// 離線：註冊 service worker（需 https 網址；本機 file:// 開啟時會略過）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('offline', () => { info.textContent += '（目前沒有網路：路線與定位照常，沒看過的地圖區塊會是空白）'; });
</script>
</body>
</html>
